name: Build

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    name: Windows build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Run tests
        run: pytest

      - name: Build executables
        run: |
          pyinstaller --noconfirm --clean LlamaServer.spec
          pyinstaller --noconfirm --clean LlamaServerGUI.spec

      - name: Add default config files
        shell: pwsh
        run: |
          Copy-Item profiles.json dist\profiles.json -ErrorAction SilentlyContinue
          Copy-Item settings.json dist\settings.json -ErrorAction SilentlyContinue

      - name: Create archive
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          Compress-Archive -Path dist\* -DestinationPath "LlamaServer-windows-$sha.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LlamaServer-windows-${{ github.sha }}
          path: LlamaServer-windows-*.zip
          if-no-files-found: error
