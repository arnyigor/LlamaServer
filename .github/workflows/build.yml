name: Build

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag for manual release, for example v1.5.1"
        required: true
        type: string

permissions:
  contents: write

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  windows:
    name: Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          .\.venv\Scripts\python.exe -m pip install pyinstaller

      - name: Run tests
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests

      - name: Type-check src/core (mypy)
        run: |
          .\.venv\Scripts\python.exe -m pip install mypy
          .\.venv\Scripts\python.exe -m mypy src/core/

      - name: Build executable
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: .\.venv\Scripts\pyinstaller.exe --noconfirm --clean LlamaServerGUI.spec

      - name: Package executable
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } elseif ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.release_tag }}" } else { "${{ github.sha }}" }
          $archive = "LlamaServerGUI-windows-$tag.zip"
          Compress-Archive -Path dist\LlamaServerGUI.exe -DestinationPath $archive -Force
          "ARCHIVE=$archive" >> $env:GITHUB_ENV

      - name: Upload build artifact
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: LlamaServerGUI-windows
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: ${{ env.ARCHIVE }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
