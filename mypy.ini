# mypy: start with src/core only; its dataclass discipline is already solid.
# Expand the scope as the rest of the code gets typed.
[mypy]
python_version = 3.12
ignore_missing_imports = True
no_implicit_optional = True
# warn_unused_ignores is off: some ignores in cli_parser are only needed on
# POSIX stubs (ctypes.windll), while CI runs mypy on Windows.
