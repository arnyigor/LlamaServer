# mypy: сначала только src/core — там dataclass-дисциплина уже хорошая.
# По мере типизации остального кода границы можно расширять.
[mypy]
python_version = 3.12
ignore_missing_imports = True
no_implicit_optional = True
# warn_unused_ignores не включаем: часть ignore в cli_parser нужна только на
# POSIX-стабах (ctypes.windll), а CI гоняет mypy на Windows.
